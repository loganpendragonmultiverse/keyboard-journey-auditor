name: Release build
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.11" }
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm audit --omit=dev
      - run: python tools/release_package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reviewed-distributions
          path: release/*
  native:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, browser: safari }
          - { os: windows-latest, browser: edge }
          - { os: ubuntu-latest, browser: firefox }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: { name: reviewed-distributions, path: release }
      - name: Test actual ZIP in preconfigured native browser
        run: python tools/native_browser_acceptance.py --browser "${{ matrix.browser }}" --web-zip release/keyboard-journey-auditor-v0.1.1-web.zip --commit "${{ github.event.pull_request.head.sha || github.sha }}" --output "native-results/${{ matrix.browser }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-${{ matrix.browser }}
          path: native-results/*.json
          if-no-files-found: error
