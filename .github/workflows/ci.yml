name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm audit --omit=dev
  native-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "22" }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: { python-version: "3.12" }
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm audit --omit=dev
      - run: python tools/release_package.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: { name: native-candidate-distributions, path: "release/*", if-no-files-found: error }
  native:
    needs: native-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-26-intel, browser: safari }
          - { os: windows-latest, browser: edge }
          - { os: ubuntu-latest, browser: firefox }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: { name: native-candidate-distributions, path: release }
      - name: Test actual ZIP in preconfigured native browser
        run: python tools/native_browser_acceptance.py --browser "${{ matrix.browser }}" --web-zip release/keyboard-journey-auditor-v0.1.1-web.zip --commit "${{ github.event.pull_request.head.sha || github.sha }}" --output "native-results/${{ matrix.browser }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-${{ matrix.browser }}
          path: native-results/*.json
          if-no-files-found: error
