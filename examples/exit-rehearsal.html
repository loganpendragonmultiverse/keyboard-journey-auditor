<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Keyboard exit regression fixture</title></head><body>
<h1>Owned synthetic keyboard exit fixture</h1>
<p>This page is a development fixture. It keeps value-free evidence in memory only.</p>
<label><input id="owned" type="checkbox"> This is my owned synthetic test page.</label>
<label><input id="normal" type="checkbox"> This is a normal browsing window.</label>
<button id="start">Start test session</button>
<button id="stop">Stop test session</button>
<p id="status" role="status">Idle</p>
<section id="root" tabindex="-1" aria-label="Selected test root">
<button id="inside">Inside action</button>
<button id="programmatic">Move focus outside programmatically</button>
<button id="blur">Blur current focus</button>
</section>
<button id="outside">Outside focus target</button>
<p id="outside-pointer">Outside non-focusable pointer target</p>
<pre id="report">No evidence.</pre>
<script type="module" src="./exit-rehearsal.js"></script>
</body></html>
